name: OpenCart Hybrid Automation CI

on:
  push:
    branches: [ main, feature/cucumber-bdd ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Start Selenium Grid (Hub + Chrome)
        run: docker compose up -d selenium-hub chrome

      - name: Wait for Selenium Grid Readiness
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:4444/wd/hub/status | grep -q "\"ready\": true"; do sleep 2; done'

      - name: Run TestNG POM Suite on Grid
        run: mvn test -Denv=qa -Dexecution_env=remote -Dos=linux -Dbrowser=chrome -DsuiteXmlFile=testng-hybrid -DautoOpenReport=false

      - name: Tear Down Selenium Grid
        if: always()
        run: docker compose down

      - name: Upload Extent Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-screenshots
          path: |
            reports/
            screenshots/
          retention-days: 7